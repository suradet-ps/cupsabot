name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please describe the problem before the solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard, missing, or slow today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: Requisitions keep their visible lifecycle (Draft → Submitted → Approved → Fulfilled) - no hidden states.
          required: true
        - label: Row-Level Security stays on; each PCU's data stays in its own drawer.
          required: true
        - label: Complex server-side logic lives in Supabase RPC functions, not client code.
          required: true
        - label: No secrets or service-role keys in the client bundle.
          required: true
